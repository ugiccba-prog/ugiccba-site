<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App Entrenamiento UGICCBA</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <style>
        :root { --rojo: #ff3e3e; --verde: #00ff88; --azul: #007bff; }
        
        /* Reset total para evitar bloqueos de clics */
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: #000; color: white; font-family: sans-serif; 
            overflow: hidden; touch-action: manipulation;
        }

        #container { position: relative; width: 100%; height: 100%; }

        /* Capas de fondo (Video y Canvas) */
        video, canvas { 
            position: absolute; inset: 0; width: 100%; height: 100%; 
            object-fit: cover; transform: scaleX(-1); z-index: 1; 
        }
        
        /* Capa de Puntos (Sin clics para que no moleste) */
        #ui { 
            position: absolute; top: 10px; width: 100%; 
            display: flex; justify-content: space-around; 
            z-index: 10; pointer-events: none; 
        }
        .stat { background: rgba(0,0,0,0.8); padding: 8px 12px; border-radius: 8px; border: 1px solid var(--azul); font-weight: bold; }

        /* PANTALLAS (MODALES) - Aquí forzamos que reciba clics */
        .modal { 
            position: absolute; inset: 0; 
            background: rgba(18,18,18,0.98); 
            z-index: 2000; /* Siempre al frente */
            display: flex; flex-direction: column; 
            justify-content: center; align-items: center; 
            text-align: center; padding: 20px;
            pointer-events: auto !important; /* Forzar clics */
        }

        .form-container { 
            width: 100%; max-width: 320px; 
            display: flex; flex-direction: column; gap: 15px; 
            pointer-events: auto !important;
        }

        .form-group { text-align: left; width: 100%; pointer-events: auto !important; }
        
        label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: var(--azul); font-weight: bold; }

        input { 
            width: 100%; padding: 14px; border-radius: 8px; 
            border: 2px solid #333; background: #222; color: white; 
            font-size: 16px !important; /* Evita zoom en iPhone */
            box-sizing: border-box; 
            outline: none;
            pointer-events: auto !important;
        }
        
        input:focus { border-color: var(--azul); background: #333; }

        button { 
            width: 100%; padding: 16px; background: var(--azul); color: white; 
            border: none; border-radius: 50px; cursor: pointer; 
            font-size: 1.1rem; font-weight: bold; margin-top: 10px; 
            pointer-events: auto !important;
            transition: 0.2s;
        }
        button:active { transform: scale(0.98); }

        .reglas-box { font-size: 0.85rem; background: rgba(255,255,255,0.05); padding: 12px; border-radius: 10px; }

        .tabla-res { width: 100%; max-width: 280px; margin-bottom: 15px; border-collapse: collapse; }
        .tabla-res td { padding: 8px 0; border-bottom: 1px solid #333; }
        .val { text-align: right; color: var(--azul); font-weight: bold; }
        
        .flash-error { animation: flash 0.3s; }
        @keyframes flash { 0% { background: rgba(255,0,0,0); } 50% { background: rgba(255,0,0,0.4); } 100% { background: rgba(255,0,0,0); } }
    </style>
</head>
<body>
    <div id="container">
        <video id="webcam" autoplay playsinline style="display:none;"></video>
        <canvas id="output_canvas"></canvas>
        
        <div id="ui">
            <div class="stat">PTS: <span id="score">0</span></div>
            <div class="stat">⌛ <span id="timer">45</span>s</div>
        </div>

        <div id="start-screen" class="modal">
            <h2 style="margin-top:0">DATOS DEL ATLETA</h2>
            <div class="form-container">
                <div class="form-group">
                    <label>Nombre Completo:</label>
                    <input type="text" id="nombre" placeholder="Escribe aquí..." autocomplete="off">
                </div>
                <div class="form-group">
                    <label>Deporte / Puesto:</label>
                    <input type="text" id="deporte" placeholder="Ej: Fútbol - Arquero" autocomplete="off">
                </div>
                <div class="reglas-box">
                    <p style="color:var(--rojo); margin:0">● Rojo: Tocar (+10 pts)</p>
                    <p style="color:var(--verde); margin:5px 0 0">○ Verde: Ignorar (-10 pts)</p>
                </div>
                <button id="btn-start" type="button">INICIAR ENTRENAMIENTO</button>
            </div>
        </div>

        <div id="end-screen" class="modal" style="display: none;">
            <h1>RESULTADOS</h1>
            <table class="tabla-res">
                <tr><td>Atleta</td><td id="res-nombre" class="val">-</td></tr>
                <tr><td>Puntos</td><td id="res-puntos" class="val">0</td></tr>
                <tr><td>Reacción Prom.</td><td id="res-reaccion" class="val">0s</td></tr>
            </table>
            <p id="estado-envio" style="font-size:0.75rem; opacity:0.6; margin:0 0 12px">Guardando…</p>
            <button onclick="location.reload()" style="background:#444">REPETIR</button>
            <a href="../../pages/jugadores.html" style="color:gray; font-size:0.8rem; margin-top:14px; text-decoration:none;">← Volver al portal</a>
        </div>
    </div>

    <script src="./ugi-envio.js"></script>
    <script>
        /* En celular esta version se pelea con la pantalla: mobile.html usa un modelo
           mas liviano, pantalla completa y un target mas chico. Con ?pc=1 se fuerza esta. */
        if (/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) && location.search.indexOf('pc=1') === -1) {
            location.replace('mobile.html' + location.search);
        }

        /* Planilla propia de los modulos de reaccion (distinta a la del Stroop).
           Para unificar todo en una sola, borra esta linea: UGI usa su DATABASE_URL. */
        const URL_REACCION = "https://script.google.com/macros/s/AKfycbxlggsDTFAzD-Zx7anY7423nm5MXRtm-MQoJUkCwbJ9A8dRSN7PIxN0muBrk9LpSKlh/exec"; 

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output_canvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const timerEl = document.getElementById('timer');
        
        let score = 0, timeLeft = 45, gameActive = false, targetTimer;
        let target = { x: 0, y: 0, radius: 55, type: 'good' };
        let ultimoImpacto = 0;   // evita que dos manos (o dos frames) cuenten el mismo toque

        /* El canvas tiene que tener su tamano real ANTES del primer target: si no,
           mide 300x150 por defecto y la primera pelota sale siempre arriba a la izquierda. */
        function ajustarCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        ajustarCanvas();
        window.addEventListener('resize', ajustarCanvas);
        let stats = { nombre: "", deporte: "", aciertos: 0, errores: 0, ignorados: 0, tiemposReaccion: [], inicioTarget: 0 };

        /* Si el CDN de MediaPipe no carga (red con filtro, caida de jsdelivr, sin internet),
           antes la pagina quedaba en negro sin explicar nada: el script moria en esta linea.
           Ahora avisa y no deja arrancar el juego. */
        const mediapipeOk = (typeof Hands === 'function' && typeof Camera === 'function');
        const hands = mediapipeOk ? new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` }) : null;
        if (hands) hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.5 });
        
        if (hands) hands.onResults((results) => {
            if (!gameActive) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Dibujar círculo
            ctx.beginPath(); ctx.arc(target.x, target.y, target.radius, 0, Math.PI * 2);
            ctx.fillStyle = target.type === 'good' ? '#ff3e3e' : '#00ff88';
            ctx.fill(); ctx.strokeStyle = "white"; ctx.lineWidth = 5; ctx.stroke();

            if (results.multiHandLandmarks) {
                for (const landmarks of results.multiHandLandmarks) {
                    const x = landmarks[8].x * canvas.width;
                    const y = landmarks[8].y * canvas.height;
                    // Dibujar puntero
                    ctx.fillStyle = "white"; ctx.beginPath(); ctx.arc(x, y, 12, 0, Math.PI * 2); ctx.fill();
                    // Colisión
                    if (Math.hypot(x - target.x, y - target.y) < target.radius + 15) processHit();
                }
            }
        });

        function moveTarget(porTiempo) {
            if (targetTimer) clearTimeout(targetTimer);
            // "Ignorado" es el verde que se fue solo, sin que lo tocaran: eso es el acierto
            // del ejercicio. Antes tambien sumaba cuando lo tocabas, o sea contaba el error dos veces.
            if (gameActive && porTiempo && target.type === 'bad') stats.ignorados++;
            
            target.x = Math.random() * (canvas.width - 150) + 75;
            target.y = Math.random() * (canvas.height - 150) + 75;
            target.type = Math.random() > 0.4 ? 'good' : 'bad';
            stats.inicioTarget = Date.now();

            targetTimer = setTimeout(() => { if (gameActive) moveTarget(true); }, 2000);
        }

        function processHit() {
            if (Date.now() - ultimoImpacto < 300) return;
            ultimoImpacto = Date.now();
            let reac = (Date.now() - stats.inicioTarget) / 1000;
            if (target.type === 'good') { 
                score += 10; stats.aciertos++; stats.tiemposReaccion.push(reac); 
            } else { 
                score -= 10; stats.errores++; 
                document.getElementById('container').classList.add('flash-error');
                setTimeout(() => document.getElementById('container').classList.remove('flash-error'), 300);
            }
            scoreEl.innerText = score;
            moveTarget(false);
        }

        const camera = mediapipeOk ? new Camera(video, {
            onFrame: async () => { await hands.send({image: video}); },
            width: 1280, height: 720
        }) : null;

        if (!mediapipeOk) {
            const b = document.getElementById('btn-start');
            b.disabled = true; b.style.opacity = '.45'; b.innerText = 'NO DISPONIBLE';
            const msg = document.createElement('p');
            msg.style.cssText = 'color:#ff8a8a;font-size:.85rem;line-height:1.4';
            msg.innerText = 'No se pudo cargar el detector de manos. Revisá la conexión y volvé a entrar; si estás en una red con filtros, probá desde otra.';
            b.parentNode.insertBefore(msg, b);
        }

        // El mismo pibe no tiene que retipear su nombre en cada juego
        const perfil = UGI.getPerfil();
        document.getElementById('nombre').value = perfil.nombre || '';
        document.getElementById('deporte').value = perfil.deporte || '';

        document.getElementById('btn-start').addEventListener('click', function(e) {
            e.preventDefault();
            stats.nombre = UGI.normalizarNombre(document.getElementById('nombre').value);
            stats.deporte = document.getElementById('deporte').value.trim();

            if(!stats.nombre || !stats.deporte) {
                alert("Por favor, completa tu nombre y deporte.");
                return;
            }
            UGI.setPerfil(stats.nombre, stats.deporte);

            ajustarCanvas();

            document.getElementById('start-screen').style.display = 'none';
            video.style.display = 'block';
            gameActive = true;
            moveTarget(false);
            if (camera) camera.start().catch(err => alert("Error de cámara: " + err));

            let cd = setInterval(() => {
                timeLeft--; 
                timerEl.innerText = timeLeft; 
                if (timeLeft <= 0) { clearInterval(cd); endGame(); }
            }, 1000);
        });

        function apagarCamara() {
            // Sin esto la webcam queda prendida despues del test: la lucecita sigue encendida
            try { camera.stop(); } catch (e) {}
            const stream = video.srcObject;
            if (stream) { stream.getTracks().forEach((t) => t.stop()); video.srcObject = null; }
        }

        async function endGame() {
            gameActive = false;
            clearTimeout(targetTimer);
            apagarCamara();
            let prom = stats.tiemposReaccion.length > 0 ? (stats.tiemposReaccion.reduce((a,b)=>a+b)/stats.tiemposReaccion.length).toFixed(3) : 0;
            
            document.getElementById('res-nombre').innerText = stats.nombre;
            document.getElementById('res-puntos').innerText = score;
            document.getElementById('res-reaccion').innerText = prom + "s";
            document.getElementById('end-screen').style.display = 'flex';

            /* Antes esto era fetch(..., mode:'no-cors'): la respuesta es opaca, asi que el
               envio "salia bien" aunque el Sheet devolviera error, y si fallaba el resultado
               se perdia. Ahora UGI verifica la respuesta y, si no entra, lo guarda en el
               celular y lo reintenta solo cuando el jugador vuelve a abrir cualquier juego. */
            const estado = document.getElementById('estado-envio');
            UGI.enviarResultado({
                jugador: stats.nombre,
                deporte: stats.deporte,
                juego: 'REACCION_PC',
                version: '2.0',
                puntos: score,
                reaccion: prom,
                aciertos: stats.aciertos,
                errores: stats.errores,
                ignorados: stats.ignorados
            }, URL_REACCION).then(function (r) {
                const pend = UGI.pendientes();
                estado.innerText = r.ok
                    ? '✓ Resultado guardado en la planilla'
                    : '⚠ Sin conexión — guardado en el dispositivo' + (pend ? ' (' + pend + ' pendiente' + (pend > 1 ? 's' : '') + ')' : '') + ', se envía solo al reconectar';
            });
        }
    </script>
</body>
</html>
