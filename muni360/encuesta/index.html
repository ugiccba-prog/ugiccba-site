<!doctype html>
<html lang="es">
<head>
 <meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'" />
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <title>Muni360 · Cuestionario anónimo</title>
 <link rel="icon" type="image/png" href="../assets/images/favicon.png">
 <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
 <link rel="stylesheet" href="../assets/styles/muni360-theme.css?v=b77f3ca1b82e">
  <style>
  :root{--navy:var(--muni-ink);--teal:var(--muni-accent);--bg:var(--muni-canvas);--card:var(--muni-surface);--muted:var(--muni-muted);--border:var(--muni-border)}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:var(--muni-font);background:var(--muni-atmosphere);background-attachment:fixed;color:var(--navy);padding:clamp(12px,4vw,28px)}
  main{max-width:620px;margin:0 auto;background:var(--card);border:1px solid #dfd7c8;border-top:4px solid #1c7fb2;border-radius:22px;box-shadow:0 12px 28px rgb(8 43 73 / 6%);padding:clamp(14px,4vw,24px)}
  h1{margin:0 0 8px;font:700 1.6rem/1.2 var(--muni-heading);color:var(--navy)}
  .meta{font-size:.85rem;color:var(--teal);font-weight:600;margin:0 0 8px}
  .desc{font-size:.92rem;color:var(--muted);margin:0 0 18px}
  .anon-pill{display:inline-block;background:var(--muni-sky-soft);color:var(--navy);border:1px solid #96d1ec;border-radius:999px;padding:4px 12px;font-size:.76rem;font-weight:700;margin-bottom:14px}
  .q{min-width:0;border:0;border-top:1px solid var(--border);margin:0;padding:14px 0}
  .q legend,.q label.q-title{display:block;font-weight:600;font-size:.95rem;color:var(--navy);margin-bottom:10px}
  .scale{display:flex;gap:8px;flex-wrap:wrap}
  .scale button{flex:1 1 42px;min-height:44px;padding:8px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--navy);font:inherit;font-weight:700;cursor:pointer;font-size:1rem}
  .scale button.selected{background:var(--teal);color:#fff;border-color:var(--teal)}
  .opts{display:grid;gap:8px}
  .opts label{display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 12px;border:1px solid var(--border);border-radius:10px;cursor:pointer;font-size:.92rem}
  textarea{width:100%;min-height:84px;padding:10px;border:1px solid var(--border);border-radius:10px;font:inherit;resize:vertical}
  .submit{width:100%;margin-top:14px;padding:13px;border:0;border-radius:999px;background:var(--navy);color:#fff;font:inherit;font-weight:700;min-height:44px;cursor:pointer}
  :focus-visible{outline:3px solid var(--muni-focus);outline-offset:2px}
  input{accent-color:var(--muni-accent)}
  .submit:disabled{opacity:.6;cursor:wait}
  .status{margin-top:12px;font-size:.9rem;color:#b42318}
  .done{text-align:center;padding:24px 8px}
  .done h2{color:var(--teal);margin:0 0 8px}
 </style>
</head>
<body>
 <main id="root">
  <span class="anon-pill">100% anónimo · No pide nombre ni DNI</span>
  <p id="loading">Cargando cuestionario…</p>
 </main>
 <script src="../assets/scripts/muni360-config.js?v=bd4e9f7a6bae"></script>
 <script>
 (function(){
  'use strict';
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const root=document.getElementById('root');
  const params=new URLSearchParams(location.search);
  const code=(params.get('c')||location.hash.replace(/^#/,'')||'').trim();
  const isDemo=params.get('demo')==='1'||code.startsWith('demo_');
  const base=(window.MUNI_CONFIG&&window.MUNI_CONFIG.apiBaseUrl)||'';
  const DEMO_KEY='muni360_demo_surveys_v1';

  async function api(path,body){
   if(isDemo){
    let list=[];
    try{const raw=localStorage.getItem(DEMO_KEY);if(raw)list=JSON.parse(raw)||[];}catch(_){}
    const idx=list.findIndex(x=>x.public_code===body.code);
    if(idx<0)throw new Error('Cuestionario de demostración no encontrado. Abrí primero el Modo Demo en Muni360.');
    const s=list[idx];
    if(path==='/api/surveys/public'){
     if(s.status==='draft')throw new Error('Cuestionario no disponible.');
     return {ok:true,closed:s.status==='closed',survey:s};
    }
    if(path==='/api/surveys/submit'){
     if(s.status!=='active')throw new Error('Este cuestionario ya no recibe respuestas.');
     s.responses=Array.isArray(s.responses)?s.responses:[];
     s.responses.unshift(body.answers||{});
     s.updated_at=new Date().toISOString();
     try{localStorage.setItem(DEMO_KEY,JSON.stringify(list));}catch(_){}
     return {ok:true};
    }
   }
   const res=await fetch(base,{method:'POST',credentials:'omit',referrerPolicy:'no-referrer',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({...body,path})});
   const data=await res.json().catch(()=>({}));
   if(!res.ok||data.ok===false)throw new Error(data.error||data.message||'No se pudo completar la operación.');
   return data;
  }

  if(!code||(!isDemo&&!base)){
   root.innerHTML='<span class="anon-pill">Cuestionario anónimo</span><h1>Enlace incompleto</h1><p class="desc">Pedile a tu coordinador/a el enlace completo del cuestionario.</p>';
   return;
  }

  const anonLabel=isDemo?'Modo Demo · 100% anónimo (respuesta local)':'100% anónimo · No pide nombre ni DNI';

  api('/api/surveys/public',{code}).then(data=>{
   const s=data.survey||{};
   const scope=[s.activity,s.categoria,s.equipo].filter(Boolean).join(' · ');
   if(data.closed){
    root.innerHTML='<span class="anon-pill">Cuestionario cerrado</span><p class="meta">'+esc(scope)+'</p><h1>'+esc(s.title)+'</h1><p class="desc">Este cuestionario ya finalizó y no recibe más respuestas.</p>';
    return;
   }
   const answers={};
   const questions=Array.isArray(s.questions)?s.questions:[];
   root.innerHTML=
    '<span class="anon-pill">'+esc(anonLabel)+'</span>'+
    '<p class="meta">'+esc(scope)+'</p>'+
    '<h1>'+esc(s.title)+'</h1>'+
    (s.description?'<p class="desc">'+esc(s.description)+'</p>':'')+
    '<form id="survey-form">'+
     questions.map(q=>{
      const req=q.required?' *':'';
      if(q.type==='scale'){
       return '<fieldset class="q" data-qid="'+esc(q.id)+'"><legend>'+esc(q.label+req)+'</legend><div class="scale">'+[1,2,3,4,5].map(n=>'<button type="button" data-val="'+n+'">'+n+'</button>').join('')+'</div></fieldset>';
      }
      if(q.type==='single'||q.type==='multi'){
       const inputType=q.type==='single'?'radio':'checkbox';
       return '<fieldset class="q" data-qid="'+esc(q.id)+'"><legend>'+esc(q.label+req)+'</legend><div class="opts">'+(q.options||[]).map(o=>'<label><input type="'+inputType+'" name="'+esc(q.id)+'" value="'+esc(o)+'"><span>'+esc(o)+'</span></label>').join('')+'</div></fieldset>';
      }
      return '<div class="q" data-qid="'+esc(q.id)+'"><label class="q-title" for="t-'+esc(q.id)+'">'+esc(q.label+req)+'</label><textarea id="t-'+esc(q.id)+'" maxlength="500" placeholder="Escribí tu respuesta breve…"></textarea></div>';
     }).join('')+
     '<button class="submit" type="submit">Enviar respuesta anónima</button>'+
     '<p class="status" id="err" role="status"></p>'+
    '</form>';

   root.querySelectorAll('.scale button').forEach(btn=>{
    btn.onclick=()=>{
     const fs=btn.closest('fieldset');
     fs.querySelectorAll('button').forEach(b=>b.classList.remove('selected'));
     btn.classList.add('selected');
     answers[fs.dataset.qid]=Number(btn.dataset.val);
    };
   });

   const form=document.getElementById('survey-form');
   form.onsubmit=async e=>{
    e.preventDefault();
    const err=document.getElementById('err');
    err.textContent='';
    for(const q of questions){
     if(q.type==='single'){
      const checked=form.querySelector('input[name="'+CSS.escape(q.id)+'"]:checked');
      if(checked)answers[q.id]=checked.value;
     }else if(q.type==='multi'){
      answers[q.id]=[...form.querySelectorAll('input[name="'+CSS.escape(q.id)+'"]:checked')].map(x=>x.value);
     }else if(q.type==='text'){
      answers[q.id]=(document.getElementById('t-'+q.id)?.value||'').trim();
     }
     if(q.required){
      const val=answers[q.id];
      const empty=val==null||val===''||(Array.isArray(val)&&!val.length);
      if(empty){err.textContent='Respondé las preguntas obligatorias (*).';return;}
     }
    }
    const btn=form.querySelector('.submit');
    btn.disabled=true;
    try{
     await api('/api/surveys/submit',{code,answers});
     root.innerHTML='<div class="done"><h2>¡Gracias por responder!</h2><p class="desc">Tu respuesta anónima quedó registrada.</p></div>';
    }catch(ex){
     err.textContent=ex.message||'No se pudo enviar la respuesta.';
     btn.disabled=false;
    }
   };
  }).catch(ex=>{
   root.innerHTML='<span class="anon-pill">Cuestionario anónimo</span><h1>Cuestionario no disponible</h1><p class="desc">'+esc(ex.message||'Verificá el enlace con tu coordinador/a.')+'</p>';
  });
 })();
 </script>
</body>
</html>
